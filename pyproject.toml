[project]
name = "ats"
version = "0.1.0"
description = "Applicant Tracking System API"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.31.0",
    "alembic==1.13.3",
    "pydantic[email]==2.9.2",
    "pydantic-settings==2.5.2",
    "PyJWT==2.9.0",
    "slowapi==0.1.9",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-multipart==0.0.12",
    "aiofiles==24.1.0",
    "boto3==1.35.0",
    "celery[redis]>=5.6.3",
    "redis>=6.4.0",
    "pgvector>=0.5.0",
    "pypdf>=6.14.2",
]

[dependency-groups]
dev = [
    "httpx==0.27.2",
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "aiosqlite==0.20.0",
]
