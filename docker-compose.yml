services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ats
      POSTGRES_PASSWORD: ats_secret
      POSTGRES_DB: ats_db
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ats"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: .
    command: ["uv", "run", "celery", "-A", "app.core.celery_app", "worker", "--loglevel=info"]
    volumes:
      - uploads:/app/uploads
    # The image's HEALTHCHECK curls localhost:8000/health, which only the api
    # service serves — worker/beat run no HTTP server, so that check always
    # fails here. Use a celery-appropriate check instead.
    healthcheck:
      test: ["CMD-SHELL", "uv run celery -A app.core.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    restart: unless-stopped

  beat:
    build: .
    command: ["uv", "run", "celery", "-A", "app.core.celery_app", "beat", "--loglevel=info"]
    # Beat has no HTTP server and no inspectable worker process to ping;
    # disable the inherited api-oriented HEALTHCHECK rather than report false failures.
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  uploads:
